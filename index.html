<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#200518" />
  <title>LUMINOUS | Academic Resource Hub</title>

  <!-- SEO Core -->
  <meta name="description"
    content="LUMINOUS is a centralized academic resource hub for sharing notes, PDFs, previous papers, syllabus, and study materials."/>
 <meta name="keywords"
content="notes, PDFs, previous papers, syllabus, study materials, academic resources, LUMINOUS" />
 <meta name="author" content="ARISTOTLE-CREATOR" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://aristotle-creator.github.io/LUMINOUS/" />
  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LUMINOUS | Academic Resource Hub" />
  <meta property="og:description"
content="A centralized platform for notes, PDFs, syllabus, previous papers, and academic resources." />
  <meta property="og:url" content="https://aristotle-creator.github.io/LUMINOUS/" />
  <meta property="og:image" content="https://luminous-hub.netlify.app/public/luminous-logo.jpeg" />
  <meta property="og:site_name" content="LUMINOUS Academic Resource Hub" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LUMINOUS | Academic Resource Hub" />
  <meta name="twitter:description"
content="LUMINOUS is a centralized academic resource hub for sharing notes, PDFs, previous papers, syllabus, and study materials." />
 <meta name="twitter:image" content="https://luminous-hub.netlify.app/public/luminous-logo.jpeg" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
  <link rel="shortcut icon" href="public/luminous-logo.jpeg" type="image/x-icon" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;500&display=swap"
    rel="stylesheet" />
</head>

<body>

 <nav class="navbar">
  <div class="logo-container">
      <img src="public/luminous-logo.jpeg" alt="LUMINOUS Logo" />
      
      <div class="logo-text">
        <h1>LUMINOUS</h1>
        <p>Academic Resource Hub</p>
      </div>
  </div>

  <div class="nav-links">
      <a href="https://github.com/ARISTOTLE-CREATOR/LUMINOUS" target="_blank" class="github-btn">
        GitHub
      </a>
  </div>
 </nav>
  <main>
    <section class="filter-container">
      <div class="filter-scroll">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="1.1">1.1</button>
        <button class="filter-pill" data-filter="1.2">1.2</button>
        <button class="filter-pill" data-filter="2.1">2.1</button>
        <button class="filter-pill" data-filter="2.2">2.2</button>
        <button class="filter-pill" data-filter="3.1">3.1</button>
        <button class="filter-pill" data-filter="3.2">3.2</button>
        <button class="filter-pill" data-filter="4.1">4.1</button>
        <button class="filter-pill" data-filter="4.2">4.2</button>
       <button class="share-btn">
    SHARE_RESOURCES ⤴ 
</button>
      </div>
    </section>

    <section class="subjects-grid">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading Resources...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>
      Designed & Developed by <a href="https://github.com/ARISTOTLE-CREATOR/LUMINOUS" target="_blank"> ARISTOTLE-CREATOR</a>
    </p>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="index.js"></script>
</body>

</html>
